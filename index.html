<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Básica</title>
    <!-- Carrega o Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuração de fonte para o corpo */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-green': '#10b981', /* Esmeralda 500 */
                        'primary-dark': '#0f766e',  /* Teal 700 */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <!-- Container Principal do Card -->
    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-2xl border border-gray-100 transform transition duration-500 hover:scale-[1.02]">
        
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-2">
                Bem-vindo(a)!
            </h1>
            <p class="text-gray-500 text-sm">
                Insira seu nome para acessar o recurso.
            </p>
        </header>

        <!-- Formulário de Input -->
        <form id="landing-form" onsubmit="event.preventDefault(); showConfirmation();">
            
            <div class="mb-6">
                <label for="name-input" class="block text-sm font-medium text-gray-700 mb-1 text-left">
                    Seu Nome
                </label>
                <!-- O input com a tag placeholder solicitada -->
                <input 
                    type="text" 
                    id="name-input" 
                    name="name" 
                    placeholder="{{current_user.name}}" 
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green transition duration-150 shadow-sm"
                >
                <p class="mt-1 text-xs text-gray-400 text-left">
                    Em um sistema real, o placeholder seria preenchido automaticamente.
                </p>
            </div>

            <button 
                type="submit"
                class="w-full bg-primary-green hover:bg-primary-dark text-white font-semibold py-2.5 rounded-lg transition duration-300 shadow-lg shadow-primary-green/30 transform hover:scale-[1.01] active:scale-100"
            >
                Continuar
            </button>
        </form>

        <!-- Modal de Confirmação (Substitui alert() ) -->
        <div id="confirmation-box" class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center p-4 z-50">
            <div class="bg-white p-6 rounded-xl shadow-2xl text-center max-w-xs w-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-primary-green mx-auto mb-4" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
                <h3 class="text-lg font-bold text-gray-900 mb-2">Sucesso!</h3>
                <p class="text-sm text-gray-600 mb-4">
                    O formulário foi enviado.
                </p>
                <button onclick="hideConfirmation()" class="px-4 py-2 bg-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-300 transition duration-150">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- Script para controle do modal -->
    <script>
        function showConfirmation() {
            // Mostra o modal
            const box = document.getElementById('confirmation-box');
            box.classList.remove('hidden');
        }

        function hideConfirmation() {
            // Esconde o modal
            const box = document.getElementById('confirmation-box');
            box.classList.add('hidden');
        }
    </script>
</body>
</html>
