<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Integridade de Documentos</title>
    <!-- Carrega Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Define a fonte Inter e fallback */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container Principal da Aplicação -->
    <div class="w-full max-w-lg bg-white rounded-xl shadow-2xl p-6 md:p-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            Análise de Documento com IA
        </h1>
        <p class="text-center text-gray-600 mb-8">
            Faça upload de uma foto de documento para que a IA procure por sinais de adulteração.
        </p>

        <!-- Área de Upload de Arquivo -->
        <div class="mb-6">
            <label for="file-input" class="block text-sm font-medium text-gray-700 mb-2">
                Selecione a Imagem do Documento
            </label>
            <input type="file" id="file-input" accept="image/*" class="w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none p-3" onchange="previewImage(event)">
        </div>

        <!-- Pré-visualização da Imagem -->
        <div id="image-preview-container" class="mb-6 hidden">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">Pré-visualização:</h2>
            <img id="image-preview" src="" alt="Pré-visualização do Documento" class="max-w-full h-auto rounded-lg border-2 border-dashed border-gray-300 mx-auto max-h-64 object-contain">
        </div>

        <!-- Botão de Análise -->
        <button id="analyze-button" onclick="analyzeDocument()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-300 disabled:opacity-50 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50" disabled>
            Analisar Documento
        </button>

        <!-- Indicador de Carregamento e Resultado -->
        <div id="status-area" class="mt-8">
            <div id="loading-indicator" class="hidden text-center">
                <div class="animate-spin inline-block w-6 h-6 border-4 border-indigo-500 border-t-transparent rounded-full mb-3"></div>
                <p class="text-indigo-600 font-medium">Analizando com a IA. Aguarde um momento...</p>
            </div>

            <div id="result-container" class="hidden p-4 rounded-lg border-l-4" role="alert">
                <!-- Novo Layout Flexível para Comparação Visual -->
                <div class="md:flex md:space-x-4">
                    <!-- Área de Visualização do Resultado da Imagem -->
                    <div id="result-image-area" class="md:w-1/2 flex justify-center items-center mb-4 md:mb-0">
                        <img id="result-image-preview" src="" alt="Imagem para Inspeção Visual" class="max-w-full h-auto rounded-lg object-contain max-h-80 border-2 border-gray-200 shadow-md">
                    </div>
                    <!-- Área de Texto do Resultado e Justificativa -->
                    <div id="result-text-area" class="md:w-1/2">
                        <h2 class="text-xl font-bold mb-2" id="result-title"></h2>
                        <h3 class="font-semibold mt-4 mb-2 text-gray-700">Detalhes da Perícia:</h3>
                        <p class="text-gray-700 text-sm" id="result-text"></p>
                    </div>
                </div>
            </div>

            <div id="error-message" class="hidden p-4 text-sm text-red-800 rounded-lg bg-red-50" role="alert">
                <span class="font-medium">Erro na Análise:</span> <span id="error-text"></span>
            </div>
        </div>
    </div>

    <script>
        // URL da API do Google Gemini (modelo multimodal)
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent";
        
        // A chave da API é definida aqui. Retornamos para "" para que o ambiente Canvas a preencha automaticamente.
        const apiKey = "AIzaSyDEhVjThDf3ZxMul6vJv_GivPvA6eW2adM"; 

        // Elementos da UI
        const fileInput = document.getElementById('file-input');
        const analyzeButton = document.getElementById('analyze-button');
        const loadingIndicator = document.getElementById('loading-indicator');
        const resultContainer = document.getElementById('result-container');
        const resultTitle = document.getElementById('result-title');
        const resultText = document.getElementById('result-text');
        const errorDiv = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const imagePreview = document.getElementById('image-preview');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const resultImagePreview = document.getElementById('result-image-preview');


        // --- Funções de Utilitário ---

        // Converte o arquivo de imagem para Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    // Remove o prefixo 'data:image/png;base64,' etc., para obter apenas os dados
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = error => reject(error);
            });
        }

        // Exibe a pré-visualização da imagem e habilita/desabilita o botão
        function previewImage(event) {
            const file = event.target.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    imagePreview.src = imageUrl;
                    resultImagePreview.src = imageUrl; // Também pré-carrega para o resultado
                    imagePreviewContainer.classList.remove('hidden');
                    analyzeButton.disabled = false;
                }
                reader.readAsDataURL(file);
            } else {
                imagePreview.src = '';
                resultImagePreview.src = '';
                imagePreviewContainer.classList.add('hidden');
                analyzeButton.disabled = true;
            }
            // Limpa resultados e erros anteriores
            resultContainer.classList.add('hidden');
            errorDiv.classList.add('hidden');
        }

        // Função principal para análise de documentos
        async function analyzeDocument() {
            const file = fileInput.files[0];

            if (!file) {
                displayError("Por favor, selecione um arquivo de imagem para análise.");
                return;
            }

            // Esconde resultados/erros antigos e mostra o loading
            resultContainer.classList.add('hidden');
            errorDiv.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');
            analyzeButton.disabled = true;

            try {
                // 1. Converte a imagem para Base64
                const base64Image = await fileToBase64(file);
                // 2. Chama a API - A chave 'apiKey' é usada da variável global
                await callGeminiAPI(base64Image, file.type);
            } catch (error) {
                console.error("Erro no processamento da imagem ou na API:", error);
                displayError("Falha ao processar o arquivo ou chamar a API. Verifique a conexão e se a chave da API está correta.");
            } finally {
                loadingIndicator.classList.add('hidden');
                // Habilita o botão se houver um arquivo
                analyzeButton.disabled = !fileInput.files.length;
            }
        }

        // --- Funções de Comunicação com a API Gemini ---

        // Implementa a lógica de backoff exponencial para lidar com erros de rede/servidor
        async function callGeminiAPI(base64Image, mimeType, maxRetries = 5) {
            // PROMPT ATUALIZADO: Foca na localização para auxiliar a inspeção visual.
            const userPrompt = "Você é um especialista em perícia forense digital de documentos. Sua primeira tarefa é classificar o conteúdo da imagem. Se a imagem claramente NÃO for um documento (como uma foto de paisagem ou objeto), responda APENAS 'NÃO É DOCUMENTO' na PRIMEIRA linha. Caso contrário, analise rigorosamente por sinais de adulteração (ex: desalinhamento de texto, fontes diferentes, inconsistências de cor, ou distorção). Se for um documento, responda APENAS 'INALTERADO' ou 'SUSPEITO DE ALTERAÇÃO' na PRIMEIRA linha. Na segunda linha, forneça uma justificação detalhada. **SE for 'SUSPEITO DE ALTERAÇÃO', sua justificação DEVE incluir a localização precisa da anomalia no documento (ex: 'canto superior esquerdo', 'campo do nome', 'assinatura central').** Não adicione nenhum outro texto ou formatação.";

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: userPrompt },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: base64Image
                                }
                            }
                        ]
                    }
                ],
            };

            for (let i = 0; i < maxRetries; i++) {
                try {
                    // A chave é usada aqui diretamente da variável global apiKey
                    const response = await fetch(`${API_URL}?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 400 || response.status === 401) {
                            // Erro de cliente ou chave inválida
                            throw new Error(`Erro na API (código ${response.status}). Verifique se a chave da API está ativa.`);
                        }
                        
                        if (response.status === 429 && i < maxRetries - 1) {
                            // Too Many Requests (Limite de taxa) - tenta novamente com backoff
                            await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
                            continue;
                        }
                        throw new Error(`Erro HTTP: ${response.status}`);
                    }

                    const result = await response.json();
                    processAIResponse(result);
                    return; // Sucesso, sai da função
                } catch (error) {
                    if (i === maxRetries - 1) {
                        throw error; // Última tentativa falhou, lança o erro
                    }
                    // Espera antes de tentar novamente
                    await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
                }
            }
        }

        // Processa o resultado e atualiza a UI
        function processAIResponse(result) {
            const candidate = result.candidates?.[0];
            const text = candidate?.content?.parts?.[0]?.text;

            if (!text) {
                displayError("A IA não retornou uma análise válida. Resposta vazia.");
                return;
            }

            // Divide o texto retornado em veredito e justificação
            const lines = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            const verdict = lines[0] || '';
            const justification = lines.slice(1).join(' ') || "Justificativa indisponível.";
            
            // Padroniza a resposta para a UI
            const upperVerdict = verdict.toUpperCase();
            const isNonDocument = upperVerdict.includes('NÃO É DOCUMENTO');
            const isAltered = upperVerdict.includes('SUSPEITO');

            // Limpa todas as classes de cor e texto primeiro
            resultContainer.classList.remove('border-green-500', 'bg-green-50', 'border-red-500', 'bg-red-50', 'border-amber-500', 'bg-amber-50');
            resultTitle.classList.remove('text-green-800', 'text-red-800', 'text-amber-800');

            if (isNonDocument) {
                // Estilo para Não Documento (Amarelo/Âmbar)
                resultTitle.textContent = "🟡 CLASSIFICAÇÃO: NÃO É DOCUMENTO";
                resultText.textContent = justification.includes('Justificativa indisponível') 
                    ? "O conteúdo carregado não foi identificado como um documento passível de análise forense." 
                    : justification;
                resultContainer.classList.add('border-amber-500', 'bg-amber-50');
                resultTitle.classList.add('text-amber-800');
            } else if (isAltered) {
                // Estilo para Alerta (Vermelho)
                resultTitle.textContent = "⚠️ SUSPEITO DE ALTERAÇÃO";
                resultText.textContent = justification;
                resultContainer.classList.add('border-red-500', 'bg-red-50');
                resultTitle.classList.add('text-red-800');
            } else {
                // Estilo para Sucesso (Verde) - Inalterado
                resultTitle.textContent = "✅ DOCUMENTO INALTERADO";
                resultText.textContent = justification;
                resultContainer.classList.add('border-green-500', 'bg-green-50');
                resultTitle.classList.add('text-green-800');
            }

            resultContainer.classList.remove('hidden');
        }

        // Exibe mensagens de erro na UI
        function displayError(message) {
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
            resultContainer.classList.add('hidden');
        }
    </script>

</body>
</html>
