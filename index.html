<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações da Entidade</title>
    <!-- Carrega o Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuração customizada do Tailwind para usar a fonte Inter */
        html {
            font-family: 'Inter', sans-serif;
        }
        /* Cor de fundo escura para todo o corpo */
       
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'card-bg': '#101720', /* Cor de fundo dos cards e da tabela, similar à imagem */
                        'primary-text': '#E5E7EB', /* Texto principal claro */
                        'secondary-text': '#9CA3AF', /* Texto de detalhe */
                        'dark-bg': '#0c1015', /* Cor de fundo da página */
                        'light-border': '#2D3748', /* Borda sutil para separar linhas/áreas */
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center justify-start">

    <!-- Container principal com responsividade: cards em uma linha, seguidos pela tabela -->
    <div class="w-full max-w-6xl mx-auto">

        <!-- Seção de Cards (mantida da versão anterior) -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">

            <!-- Card: Grupo econômico -->
            <div class="flex-1 min-w-0">
                <div class="bg-card-bg text-white p-6 rounded-xl shadow-lg transition duration-300 hover:shadow-2xl">
                    <h3 class="flex items-center text-secondary-text text-sm font-medium mb-1 uppercase tracking-wider">
                        <svg class="w-4 h-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        Grupo econômico
                    </h3>
                    <p class="text-primary-text text-lg sm:text-xl font-semibold">
                        Banco Abc Brasil
                    </p>
                </div>
            </div>

            <!-- Card: CNPJ -->
            <div class="flex-1 min-w-0">
                <div class="bg-card-bg text-white p-6 rounded-xl shadow-lg transition duration-300 hover:shadow-2xl">
                    <h3 class="flex items-center text-secondary-text text-sm font-medium mb-1 uppercase tracking-wider">
                        <svg class="w-4 h-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        CNPJ
                    </h3>
                    <p class="text-primary-text text-lg sm:text-xl font-semibold">
                        28.195.667/0001-06
                    </p>
                </div>
            </div>

            <!-- Card: CRC -->
            <div class="flex-1 min-w-0">
                <div class="bg-card-bg text-white p-6 rounded-xl shadow-lg transition duration-300 hover:shadow-2xl">
                    <h3 class="flex items-center text-secondary-text text-sm font-medium mb-1 uppercase tracking-wider">
                        <svg class="w-4 h-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        CRC
                    </h3>
                    <p class="text-primary-text text-lg sm:text-xl font-semibold">
                        12763
                    </p>
                </div>
            </div>

        </div>

        <!-- Seção da Tabela -->
        <!-- Uso de overflow-x-auto para garantir scroll horizontal em telas muito pequenas, protegendo o layout -->
        <div class="bg-card-bg rounded-xl shadow-lg overflow-x-auto">
            <table class="min-w-full divide-y divide-light-border text-primary-text">
                
                <!-- Cabeçalho da Tabela -->
                <thead class="bg-card-bg text-secondary-text text-xs uppercase tracking-wider">
                    <tr>
                        <!-- Colunas com ícones (simulando o ícone circular da imagem) -->
                        <th class="p-4 text-left font-medium whitespace-nowrap">
                            <span class="flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                Cliente
                            </span>
                        </th>
                        <th class="p-4 text-left font-medium whitespace-nowrap">
                            <span class="flex items-center">
                                <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="5"/></svg>
                                Tomador - Limite At...
                            </span>
                        </th>
                        <th class="p-4 text-left font-medium whitespace-nowrap">
                            <span class="flex items-center">
                                <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="5"/></svg>
                                SCR
                            </span>
                        </th>
                        <th class="p-4 text-left font-medium whitespace-nowrap">
                            <span class="flex items-center">
                                <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="5"/></svg>
                                CED
                            </span>
                        </th>
                        <th class="p-4 text-left font-medium whitespace-nowrap">
                            <span class="flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                Suitability
                            </span>
                        </th>
                        <th class="p-4 text-left font-medium whitespace-nowrap">
                            <span class="flex items-center">
                                <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="5"/></svg>
                                CPR
                            </span>
                        </th>
                        <th class="p-4 text-left font-medium whitespace-nowrap">
                            <span class="flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                LIMINAR
                            </span>
                        </th>
                        <th class="p-4 text-left font-medium whitespace-nowrap">
                            <span class="flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                STATUS
                            </span>
                        </th>
                    </tr>
                </thead>
                
                <!-- Corpo da Tabela (Dados) -->
                <tbody class="divide-y divide-light-border text-sm">
                    <tr>
                        <!-- Coluna Cliente com destaque (similar ao fundo pêssego da imagem) -->
                        <td class="p-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-3 py-1 text-sm font-semibold rounded-md text-gray-900 bg-orange-200">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path></svg>
                                ABC FILHO
                            </span>
                        </td>
                        <td class="p-4 whitespace-nowrap">SIM</td>
                        <td class="p-4 whitespace-nowrap">NÃO</td>
                        <td class="p-4 whitespace-nowrap">SIM</td>
                        <td class="p-4 whitespace-nowrap">AI</td>
                        <td class="p-4 whitespace-nowrap">N</td>
                        <td class="p-4 whitespace-nowrap text-secondary-text">-</td>
                        <td class="p-4 whitespace-nowrap text-secondary-text">-</td>
                    </tr>
                </tbody>

            </table>
        </div>

        <!-- Rodapé da Tabela (Número de registros) -->
        <div class="text-secondary-text text-sm mt-2 p-1">
           <a href="google.com"> 1 registro</a>
        </div>

    </div>

</body>
</html>
